name: Build CFL Aru Linux package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: ./package-release.sh dist/aru-cfl-host-linux.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: aru-cfl-host-linux
          path: dist/aru-cfl-host-linux.tar.gz*
