name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  cfl-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node tools/build-runtime.mjs --check
      - name: Build and extract Linux package
        run: |
          ./package-release.sh "$RUNNER_TEMP/aru-cfl-host-linux.tar.gz"
          mkdir "$RUNNER_TEMP/cfl-package"
          tar -xzf "$RUNNER_TEMP/aru-cfl-host-linux.tar.gz" -C "$RUNNER_TEMP/cfl-package"
      - name: Self-contained public Chord/HTTP faults and source/package processes
        env:
          CFL_TEST_PACKAGE: ${{ runner.temp }}/cfl-package
        run: node --test tests/cfl-*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: aru-cfl-host-linux
          path: |
            ${{ runner.temp }}/aru-cfl-host-linux.tar.gz
            ${{ runner.temp }}/aru-cfl-host-linux.tar.gz.sha256
